services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: locker
      POSTGRES_PASSWORD: locker
      POSTGRES_DB: locker_logs
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://locker:locker@db:5432/locker_logs
      PORT: 3000
      API_SECRET: ${API_SECRET}
    depends_on:
      - db

volumes:
  pgdata:
